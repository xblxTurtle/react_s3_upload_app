name: Basic React app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, closed]

# Need ID token write permission to use OIDC
permissions:
  contents: read
  id-token: write

jobs:

  create_lambda_source_bucket:
    runs-on: ubuntu-latest
    outputs:
      LambdaBucketName: ${{ steps.get-lambda-bucket-step.outputs.LambdaBucketName }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::485291254674:role/GitHubActionReactApp
          aws-region: eu-west-2
      
      - name: Create S3 bucket for Lambda source code
        run: |
          aws cloudformation deploy --template-file ./cfn/lambda-bucket.yml --stack-name LambdaBucket
      
      - name: Get Lambda source code Bucket Name
        id: get-lambda-bucket-step
        run: |
          echo "LambdaBucketName=$(aws cloudformation describe-stacks --stack-name LambdaBucket --query "Stacks[0].Outputs[?OutputKey=='LambdaBucket'].OutputValue" --output text)" >> "$GITHUB_OUTPUT"

      - name: archive and upload all lambdas
        shell: bash
        run: |
          set -euo pipefail

          mkdir lambda_dist

          find lambda -mindepth 1 -maxdepth 1 -type d -print0 |
            while IFS= read -r -d '' folder; do
              package_name="$(basename "$folder")"
              output_path="$GITHUB_WORKSPACE/lambda_dist/$package_name.zip"

              (
                cd "$folder"
                zip -qr "$output_path" .
              )
              
              aws s3 cp "$output_path" "s3://${{ steps.get-lambda-bucket-step.outputs.LambdaBucketName }}/$package_name.zip"
            done

  create_infra:
    runs-on: ubuntu-latest
    needs: create_lambda_source_bucket
    outputs:
      BucketName: ${{ steps.get-bucket-step.outputs.BucketName }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::485291254674:role/GitHubActionReactApp
          aws-region: eu-west-2

      - name: Create React app infra
        run: |
          aws cloudformation deploy --template-file ./cfn/infra.yml --stack-name reactAppInfra --parameter-overrides LambdaBucketName=${{needs.create_lambda_source_bucket.outputs.LambdaBucketName}}

      - name: Get React app Hosting Bucket Name
        id: get-bucket-step
        run: |
          echo "BucketName=$(aws cloudformation describe-stacks --stack-name reactAppInfra --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)" >> "$GITHUB_OUTPUT"
      
      - name: Output website URL
        run: |
          echo "$(aws cloudformation describe-stacks --stack-name reactAppInfra --query "Stacks[0].Outputs[?OutputKey=='WebsiteURL'].OutputValue" --output text)"

  build_and_upload_react_application:
    runs-on: ubuntu-latest
    needs: create_infra

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: create dist
      run: |
        mkdir dist
        cp index.html ./dist/
    
    - name: Build
      run: |
        npm install
        npx webpack

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: arn:aws:iam::485291254674:role/GitHubActionReactApp
        aws-region: eu-west-2
    
    - name: Upload react app to S3 web site hosting
      run: |
        aws s3 cp --recursive ./dist s3://${{needs.create_infra.outputs.BucketName}}