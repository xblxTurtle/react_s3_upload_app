name: Basic React app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened, closed]

# Need ID token write permission to use OIDC
permissions:
  contents: read
  id-token: write

jobs:
  create_infra:
    runs-on: ubuntu-latest
    outputs:
      HostingBucketName: ${{ steps.get-bucket-step.outputs.HostingBucketName }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::485291254674:role/GitHubActionReactApp
          aws-region: eu-west-2

      - name: Deploy infra
        run: |
          aws cloudformation deploy --template-file ./cfn/infra.yml --stack-name reactAppInfra

      - name: Get Hosting Bucket Name
        id: get-bucket-step
        run: |
          echo "HostingBucketName=$(aws cloudformation describe-stacks --stack-name reactAppInfra --query "Stacks[0].Outputs[?OutputKey=='S3HostingURI'].OutputValue" --output text)" >> "$GITHUB_OUTPUT"

  build_and_upload_react_application:
    runs-on: ubuntu-latest
    needs: create_infra

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: create dist
      run: |
        mkdir dist
        cp index.html ./dist/
    
    - name: Build
      run: |
        npm install
        npx webpack

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: arn:aws:iam::485291254674:role/GitHubActionReactApp
        aws-region: eu-west-2
    
    - name: Upload react app to S3 web site hosting
      run: |
        aws s3 cp --recursive ./dist ${{needs.create_infra.outputs.HostingBucketName}}